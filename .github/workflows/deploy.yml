name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Live check
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "checking $url"
          for i in 1 2 3 4 5; do
            body="$(curl -fsSL "$url" || true)"
            if echo "$body" | grep -q '<div id="app">' && echo "$body" | grep -q '/cv/assets/'; then
              echo "live check ok: $url serves the app shell"
              exit 0
            fi
            echo "attempt $i: app shell not found yet, retrying in 10s"
            sleep 10
          done
          echo "live check failed: $url did not serve the app shell"
          exit 1
